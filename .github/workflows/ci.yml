name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  # Keying purely on `github.ref` puts the weekly `schedule` trigger (which also runs against
  # refs/heads/main) in the SAME group as a merge-triggered push run, letting the cron run queue
  # ahead of / behind the release-carrying push run and widen the publish push-race window. Key
  # `schedule` into its own bucket so it never contends with the push-to-main group.
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

jobs:
  release-intent:
    name: release-intent
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Validate PR title for semantic release
        run: python scripts/validate_pr_title_semver.py

  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.code.outputs.code }}
      docs: ${{ steps.docs.outputs.docs }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - id: code
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # `scripts` and `benchmarks` added 2026-08-19. Their omission was a hole,
            # not a saving: scripts/ holds validate_release_assets.py (gates the
            # release), check_repo_hygiene.py (its own CI job) and file_size_budget.py
            # (the size ratchet). A PR touching only scripts/ therefore skipped
            # test-python, test-rust-core and Formatting & Linting and reported green
            # having tested nothing -- while tests/unit/test_release_assets_validation_*.py
            # (themed siblings; formerly one 5,258-line file) exist purely to test one of
            # those files. The suite ran when the TESTS changed but not when their SUBJECT
            # did. Measured on PR #1021: a
            # 3,500-line refactor of validate_release_assets.py, fully green, every test
            # lane `conclusion: skipped`. Pinned by tests/unit/test_ci_code_path_filter.py.
            # `docs/audits` added 2026-08-21: the handler-disposition ledger
            # (docs/audits/2026-08-20-handler-dispositions.json) is TEST INPUT --
            # tests/unit/test_handler_dispositions.py reads it and asserts every record still
            # resolves to a real handler. It lives under docs/ but is not documentation. Same
            # hole as the scripts/ one above with the roles reversed: the suite ran when the
            # TEST changed but not when its FIXTURE did, so a PR editing only the ledger
            # reported green having never run the test that consumes it. Measured on PR #1089,
            # whose whole purpose was to fix that test: every test-python lane SKIPPED.
            CODE_FILES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD -- src rust_core tests scripts benchmarks .github/workflows docs/audits pyproject.toml Cargo.toml Cargo.lock uv.lock 2>/dev/null || true)
          else
            CODE_FILES="main-push"
          fi
          if [ -n "$CODE_FILES" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi

      # A docs-only PR correctly skips the expensive lanes -- but the DOC-GOVERNANCE
      # tests live in test-python, so they skipped too, and this repo's documented
      # failure mode is docs drifting from the product (2026-08-19 audit: six docs held
      # a claim AND its refutation; README/tool_comparison/ENGINEER_ONBOARDING all
      # advertised a language split the product contradicted). The tests that catch
      # exactly that were not running on the changes most likely to cause it.
      #
      # `.claude/skills` is included because test_skill_library_drift.py pins every
      # skill citation, and a shrinking source file dangles them -- measured on PR
      # #1021, where a split took a file 3780 -> 340 lines and a skill cited :3577.
      - id: docs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DOC_FILES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD -- docs .claude/skills mkdocs.yml README.md AGENTS.md CLAUDE.md 2>/dev/null || true)
          else
            DOC_FILES="main-push"
          fi
          if [ -n "$DOC_FILES" ]; then echo "docs=true" >> "$GITHUB_OUTPUT"; else echo "docs=false" >> "$GITHUB_OUTPUT"; fi

  # ~8s of tests (80 of them, measured) versus a docs drift shipping unnoticed. Runs
  # when EITHER docs or code changed: a code change can invalidate a doc's claim just as
  # a doc edit can, which is the direction the 2026-08-19 audit actually found broken --
  # the product moved to 10 parser-backed languages and three docs kept saying 6+4.
  #
  # Deliberately its own job rather than a step inside test-python: it must run on
  # docs-only PRs, which is precisely when test-python does not.
  docs-governance:
    name: docs-governance
    needs: [smoke, changes]
    if: >-
      github.event_name != 'pull_request'
      || needs.changes.outputs.docs == 'true'
      || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install uv
        run: python -m pip install uv==0.11.25

      - name: Setup Python
        run: uv python install 3.12

      - name: Install Python Dev Dependencies
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Docs and skill governance
        run: |
          uv run pytest \
            tests/unit/test_public_docs_governance.py \
            tests/unit/test_enterprise_docs_governance.py \
            tests/unit/test_skill_library_drift.py \
            tests/unit/test_skill_index_sync.py \
            tests/unit/test_harness_api_docs.py \
            -v --tb=short -p no:cacheprovider

  repo-hygiene:
    name: repo-hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Repo Hygiene Guard
        run: python scripts/check_repo_hygiene.py

  smoke:
    name: smoke (ubuntu-latest)
    needs: repo-hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.11.25

      - name: Build Rust core
        working-directory: rust_core
        run: cargo build --no-default-features

      - name: Install package
        run: |
          uv venv --python 3.12
          uv pip install -e .

      - name: Smoke-test Python CLI and golden search
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m tensor_grep --version
          uv run python -m tensor_grep search ERROR tests/golden/fixture_data --format rg --sort path > smoke.out
          grep -F "tests/golden/fixture_data/readme.txt:ERROR: do not delete" smoke.out
          grep -F "tests/golden/fixture_data/server_0.log:ERROR database timeout" smoke.out

      # Regenerate-then-check in the SAME clean checkout: a real end-to-end proof (real git, real
      # working tree) that generating the code map never makes `--check` read the repo as stale
      # against its own freshly-written output (the git-dirty-oracle false positive this exercises
      # -- see evidence_receipt._repo_revision_identity's exclude_prefixes and
      # codemap._revision_exclude_prefixes). Complements the unit tests, which mock/construct git
      # state directly; this runs the real binary against the real repo's real git history.
      - name: Codemap freshness smoke (regenerate must not read as stale)
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m tensor_grep codemap
          uv run python -m tensor_grep codemap --check

  release-readiness:
    name: release-readiness
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install uv
        run: python -m pip install uv==0.11.25

      - name: Setup Python
        run: uv python install 3.12

      - name: Build docs site (strict)
        run: |
          pip install mkdocs-material
          mkdocs build --strict

      - name: Validate release/package asset consistency
        run: uv run python scripts/validate_release_assets.py

  agent-readiness:
    name: agent-readiness
    needs: [smoke, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install uv
        run: python -m pip install uv==0.11.25

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Python Dev Dependencies
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Install ast-grep CLI (AST wrapper backend)
        # The native AstBackend is GPU-gated (torch.cuda), so on a non-GPU runner the AST probe needs
        # the ast-grep CLI wrapper. Matches the pinned version installed in benchmark.yml.
        run: cargo install ast-grep --version 0.41.1 --locked

      - name: Run agent-readiness contract gate
        run: |
          # --no-sync: keep the [dev] env (tree-sitter) the step above installed; bare `uv run`
          # re-syncs to the default deps and drops the optional extras.
          uv run --no-sync python -c "from tensor_grep.backends.ast_wrapper_backend import AstGrepWrapperBackend; print('ast-grep wrapper available:', AstGrepWrapperBackend().is_available())"
          uv run --no-sync python scripts/agent_readiness.py \
            --no-shell-probes \
            --no-wsl-probe \
            --json \
            --output artifacts/agent_readiness_ci.json

  windows-agent-readiness:
    name: windows-agent-readiness
    needs: [smoke, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install uv
        run: python -m pip install uv==0.11.25

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Python Dev Dependencies
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Stage Windows public launcher shims for shell probes
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/stage_windows_ci_launchers.ps1 -RepoRoot $env:GITHUB_WORKSPACE

      - name: Run Windows agent-readiness shell probes
        shell: pwsh
        run: |
          uv run python scripts/agent_readiness.py `
            --only-shell-probes `
            --no-wsl-probe `
            --json `
            --output artifacts/agent_readiness_windows_ci.json

  package-manager-readiness:
    name: package-manager-readiness (${{ matrix.os }})
    needs: smoke
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install uv
        run: python -m pip install uv==0.11.25

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Validate Homebrew formula syntax
        if: runner.os == 'Linux'
        run: ruby -c scripts/tensor-grep.rb

      - name: Validate winget manifest syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            throw "winget is required for Windows package-manager readiness"
          }

          $versionMatch = Select-String -Path pyproject.toml -Pattern '^\s*version\s*=\s*"(?<version>[^"]+)"'
          if (-not $versionMatch) {
            throw "Unable to resolve project version from pyproject.toml"
          }
          $version = $versionMatch.Matches[0].Groups['version'].Value
          $manifestRoot = "scripts\winget-pkgs\manifests\o\oimiragieo\tensor-grep"
          $manifestPath = Join-Path $manifestRoot $version
          if (-not (Test-Path -LiteralPath $manifestPath)) {
            # A valid winget manifest needs the published release artifact's InstallerUrl
            # + SHA256, which only exist AFTER the release. Demanding the current
            # (just-bumped) version's manifest pre-release is unsatisfiable and froze
            # every release after a version bump, so warn and validate the latest
            # committed manifest for syntax instead of hard-failing.
            Write-Host "::warning::Winget manifest for $version not yet generated (created post-release with the published InstallerUrl + SHA256); validating the latest committed manifest for syntax instead."
            $latest = Get-ChildItem -LiteralPath $manifestRoot -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '^\d+\.\d+\.\d+' } |
              Sort-Object { [version]($_.Name -replace '[^0-9.].*$', '') } |
              Select-Object -Last 1
            $manifestPath = if ($latest) { $latest.FullName } else { $null }
          }
          if ($manifestPath) {
            $wingetOutput = @(winget validate --manifest $manifestPath 2>&1)
            $wingetExitCode = $LASTEXITCODE
            $wingetOutput | ForEach-Object { Write-Host $_ }
            if ($wingetExitCode -ne 0) {
              throw "winget validate failed with exit code $wingetExitCode for $manifestPath"
            }
          } else {
            Write-Host "::warning::No committed winget manifests under $manifestRoot; skipping winget syntax validation."
          }

      - name: Validate package-manager publish bundle source state
        run: uv run python scripts/prepare_package_manager_release.py --check

      - name: Build package-manager publish bundle artifact
        run: uv run python scripts/prepare_package_manager_release.py --output-dir artifacts/package-manager-bundle

      - name: Verify package-manager publish bundle checksums
        run: uv run python scripts/verify_package_manager_bundle_checksums.py --bundle-dir artifacts/package-manager-bundle

      - name: Smoke-test package-manager bundle contracts
        run: uv run python scripts/smoke_test_package_manager_bundle.py --bundle-dir artifacts/package-manager-bundle

      - name: Upload package-manager bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-manager-bundle-${{ matrix.os }}
          path: artifacts/package-manager-bundle/

  static-analysis:
    name: Formatting & Linting
    needs: [smoke, changes]
    # ALSO gated on `docs`, not just `code` (2026-08-19). `ruff format` formats Python
    # blocks INSIDE markdown fences, so a docs-only PR can break `ruff format --check
    # --preview .` -- and until now those PRs skipped this job entirely, so nothing
    # caught it. Measured the hard way: PR #1023 merged a doc whose Python fence had
    # aligned trailing comments, main's formatter gate went red, and the failure
    # surfaced on the NEXT unrelated code PR (#1025) rather than on the change that
    # caused it. Confirmed genuine rather than a Windows CRLF artifact by re-running
    # the check on an LF copy of the same file.
    #
    # This is the cheap lane (one ubuntu runner), so widening it costs a docs PR a few
    # minutes and buys back the ability to attribute a formatting break to its author.
    if: >-
      github.event_name != 'pull_request'
      || needs.changes.outputs.code == 'true'
      || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      
      - name: Setup Rust
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail https://sh.rustup.rs | sh -s -- --default-toolchain none -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup default 1.96.0
          rustup component add rustfmt clippy
          rustc --version
          cargo --version
          
      - name: Install uv
        run: python -m pip install uv==0.11.25
        
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          
      - name: Check Rust Formatting
        working-directory: rust_core
        run: cargo fmt -- --check
        
      - name: Check Rust Clippy
        working-directory: rust_core
        run: cargo clippy -- -D warnings
        
      - name: Install Python Dev Dependencies
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
        
      - name: Python Ruff Linter
        run: uv run ruff check .
        
      - name: Python Ruff Formatter
        run: uv run ruff format --check --preview .
        
      - name: Python Mypy Typecheck
        run: uv run mypy src/tensor_grep

      # Registration-completeness gate (catches "added X, missed front-door site N" — the v1.15.0
      # --rank class). Blocking as of v1.17 after a clean warn-only release cycle (zero false
      # positives through v1.16); the parser is string/comment-aware so a commented-out entry
      # cannot false-pass. To re-soften, restore `continue-on-error: true`.
      - name: Registration completeness
        run: |
          set -uo pipefail
          if [ -f .tg-registration.toml ]; then
            PYTHONPATH=src python -m tensor_grep.core.registration_check .tg-registration.toml
          else
            echo "no .tg-registration.toml present; skipping registration check"
          fi

      # Enterprise file-size budget (CEO standard, 2026-08-19). Contracts <=500, core engine
      # <=1500, tests <=2000, fixtures <=2000. Before this gate the standard had NO mechanism
      # anywhere in CI or the suite (grep-verified with a positive control), which is how 33
      # files drifted past it. Those 33 are grandfathered in scripts/file_size_allowlist.json at
      # their measured counts; the gate is fail-closed BOTH ways -- a new violation fails, an
      # allowlisted file that GROWS fails, and an entry whose file has shrunk under its limit
      # must be retired or the gate fails. So the pinned number can only go down, and each
      # refactor wave shows up as a provable decrease. Mutation controls live in
      # tests/unit/test_file_size_budget.py (all four rules observed firing, 2026-08-19).
      - name: File-size budget (ratchet)
        run: python scripts/file_size_budget.py --report

      # The companion ratchet to the one above, and the reason the three biggest offenders
      # cannot simply be split. Python resolves a bare name through the DEFINING module's
      # globals, so a function calling a monkeypatched name as a bare identifier is welded to
      # the module the tests patch: move it and the test still passes while production runs the
      # unpatched original -- a silent false green, which is the class of defect this repo has
      # paid for most. `docs/design/2026-08-19-split-floor-escape.md` converts those call sites
      # to `_self.NAME(...)`; this gate pins the remaining count per module so a conversion
      # cannot be half-done and believed complete, and a cleaned module cannot silently regress.
      # Fail-closed both ways -- growth fails, and progress not banked into the pin also fails,
      # because a pin above the real count accepts a range and a range is where a regression
      # hides. Perturbation-proved on 2026-08-19: injecting one bare call into mcp_server.py
      # took it 125 -> 126 and the gate exited 1; reverting restored a byte-identical file and
      # exit 0. Mutation controls in tests/unit/test_bare_call_ratchet.py.
      - name: Bare-call ratchet (split-floor, Route A)
        run: python scripts/bare_call_ratchet.py --report

      # rg-argv-grammar differential fuzz (task #269): five rounds of the #264-class root-
      # `.gitignore` fix each found "an argv form nobody enumerated" in
      # `bootstrap._search_path_args_raw` (the Python-only rg-passthrough's positional-path
      # extraction, whenever no compiled native `tg` binary is discoverable). Hand-written
      # enumerations kept missing a dimension (flag spelling, mid-bundle attachment, and
      # crucially argv ORDERING — rg's own grammar is order-independent, a single left-to-right
      # parse pass is not). This gate replaces enumeration with an independent whole-grammar
      # model of rg 15.1.0 (built from `rg --help`'s own flag tables, kept deliberately as the
      # ONLY such model in the repo — do not add a second one) and differential-fuzzes it
      # against the real function over 65k+ argv cases in ~3 seconds. Self-contained (only
      # needs `src/`, no dev deps), so it runs here rather than in `test-python` below. A future
      # rg upgrade must refresh `SHORT_VALUE`/`LONG_VALUE` in the script from the new
      # `rg --help` output (see the script's own docstring) — this gate is what catches a
      # missed refresh, not a substitute for doing it.
      - name: "rg argv grammar differential fuzz (task #269)"
        run: python .claude/rg_argv_differential_fuzz.py --seed 20260725 --iterations 65000

  test-python:
    name: test-python (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: [smoke, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      
      - name: Install uv
        run: python -m pip install uv==0.11.25
        
      - name: Setup Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
        
      - name: Install Rust dependencies (for PyO3 fallback)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail https://sh.rustup.rs | sh -s -- --default-toolchain none -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup default 1.96.0
          rustc --version
          cargo --version
        
      - name: Install Dependencies (Unix with retry)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python ${{ matrix.python-version }}
          for attempt in 1 2 3 4 5; do
            if uv pip install -e ".[dev,ast]"; then
              exit 0
            fi
            echo "Dependency install failed (attempt ${attempt}/5); retrying after backoff..."
            sleep $((attempt * 5))
          done
          echo "Dependency install failed after 5 attempts."
          exit 1

      - name: Install Dependencies (Windows with retry)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv venv --python ${{ matrix.python-version }}
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            uv pip install -e ".[dev,ast]"
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Warning "Dependency install failed (attempt $attempt/5); retrying after backoff..."
            Start-Sleep -Seconds (5 * $attempt)
          }
          throw "Dependency install failed after 5 attempts."
          
      - name: "Task 22 diagnostic: which route does an explicit --gpu-device-ids search take"
        # NON-GATING (continue-on-error): pure instrumentation for the PR #868 dispute over
        # whether `resolve_native_tg_binary()` returns a real, working native binary on THIS job
        # (contrary to this file's `native-build-smoke` job comment a few hundred lines below
        # claiming "`test-python` never builds `rust_core/target/release/tg`") -- see
        # scripts/diagnose_gpu_delegation_route.py's module docstring for the full background and
        # why it deliberately never touches the real (unmocked) Pipeline. Runs on every OS/Python
        # leg in the matrix so the answer is not assumed to generalize from one platform.
        continue-on-error: true
        run: uv run python scripts/diagnose_gpu_delegation_route.py

      - name: Run Pytest
        # `eval` (tests/eval/) is the agent-accuracy golden-set gate: 15 real `tg prepare`
        # subprocess calls against this repo's own ranking pipeline. Deliberately excluded from
        # this blanket run -- collection sorts tests/eval/ ahead of tests/unit/, and pyproject's
        # `-x` fail-fast means a single failure here would abort before any unit test runs,
        # exactly the flaky-e2e-masks-unit-tests trap already hit once on tests/e2e/. Run it
        # explicitly via `pytest tests/eval -m eval -v -s`.
        #
        # `test-python` never builds `rust_core/target/release/tg` (maturin builds only the
        # `pyo3/extension-module` cdylib) -- IN DISPUTE as of the task 22 investigation: see the
        # diagnostic step immediately above, which measures whether that is still true on THIS
        # job rather than repeating the claim as settled.
        run: uv run pytest tests -v --tb=short -m "not eval"

      # The other half of the `-m "not eval"` exclusion above (audit finding TEST-005).
      # Excluding tests/eval/ from the BLANKET run is correct and stays: collection sorts
      # tests/eval/ ahead of tests/unit/, and `-x` fail-fast means one failure there would
      # abort before a single unit test ran. But having correctly excluded it, nobody added
      # the step that runs it -- the comment above tells a HUMAN to run it, and no
      # automation follows an instruction. Measured: zero `run:` lines in any workflow
      # invoked tests/eval. A gate nobody runs is worse than no gate, because it is believed.
      #
      # A SEPARATE step, so it runs after the unit tests have reported and its failure can
      # never mask them -- which is what the exclusion was protecting. Deliberately NOT
      # continue-on-error: a non-gating accuracy gate is decorative. Single matrix leg:
      # ~2m20s of real `tg prepare` subprocess calls, and ranking is platform-independent.
      - name: Agent-accuracy eval gate (tests/eval)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv run pytest tests/eval -v --tb=short -m eval

  test-rust-core:
    name: test-rust-core (${{ matrix.os }}, ${{ matrix.rust_channel }})
    needs: [smoke, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    env:
      # RUST-REPLACE-SYMLINK (PR #1010): promote CANNOT_MEASURE symlink-test skips to a panic so
      # an unprivileged runner cannot go silent-green on the security arms. GitHub-hosted runners
      # hold SeCreateSymbolicLinkPrivilege; if a leg reds here it is a real environment finding,
      # not a product regression.
      TG_REQUIRE_SYMLINK_TESTS: "1"
    # #145: nightly Rust is unstable by design (a wall-clock-timing test on this leg has blocked
    # the release gate 3x on wholly non-product flakes). Only the nightly leg is non-gating here --
    # it still RUNS and stays VISIBLE (so a real nightly regression is seen and can be triaged), but
    # a nightly-only failure no longer fails this job's conclusion, so `release`'s `needs: [...,
    # test-rust-core, ...]` (below) is not blocked by it. The stable leg (every OS) is untouched and
    # still hard-gates release on a real failure.
    continue-on-error: ${{ matrix.rust_channel == 'nightly' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust_channel: [stable, nightly]
        # CI-cost discipline (thinktank-ratified): the macOS x nightly leg runs a
        # non-gating signal (continue-on-error) at ~10x the Linux rate for zero release value.
        # Nightly still runs on linux/windows every PR and all channels weekly via the cron.
        exclude:
          - os: macos-latest
            rust_channel: nightly
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      
      - name: Setup Rust ${{ matrix.rust_channel }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail https://sh.rustup.rs | sh -s -- --default-toolchain none -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          if ! rustup toolchain list | grep -q "^${{ matrix.rust_channel }}"; then
            rustup toolchain install ${{ matrix.rust_channel }} --profile minimal --no-self-update
          fi
          rustup default ${{ matrix.rust_channel }}
          # CI-harden: pre-fetch the rust_core/rust-toolchain.toml PIN (1.96.0) here, inside a
          # retry loop, so the later `cargo test` (working-directory rust_core) does NOT trigger
          # an un-retried on-demand toolchain download. A transient macos-runner network timeout
          # on that pinned-manifest fetch red-failed CI on 2 consecutive PRs (#720, #721). The
          # rustup-init curl above is already --retry 10; rustup's own toolchain fetch was not.
          ( cd rust_core
            for attempt in 1 2 3; do
              cargo --version && break
              [ "$attempt" = 3 ] && { echo "pinned-toolchain fetch failed after 3 attempts"; exit 1; }
              echo "pinned-toolchain fetch attempt $attempt failed; retrying in 15s..."; sleep 15
            done )
          rustc --version
          cargo --version
          
      - name: Setup Python for PyO3 Linker
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          
      - name: Create venv for PyO3
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" == "Windows" ]; then
            echo "$GITHUB_WORKSPACE\.venv\Scripts" >> $GITHUB_PATH
          else
            echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          fi
        shell: bash
          
      - name: Cargo Test
        working-directory: rust_core
        run: cargo test --verbose --no-default-features

  # #171 anti-bit-rot gate: today the `cuda` cargo feature (rust_core/Cargo.toml `[features]`)
  # only compiles inside `build-release-native-assets`'s nvidia legs, which are themselves
  # `if:`-skipped unless RELEASE_NATIVE_ASSET_PROFILE == 'native-frontdoor-gpu' (not the default)
  # -- so it can rot silently with zero PR-time signal. This is a fast `cargo check` (not a full
  # build/test, no CUDA toolkit required) that runs on every PR so a break is caught immediately.
  cuda-feature-check:
    name: cuda-feature-check (${{ matrix.os }})
    needs: [smoke, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python for PyO3 Linker
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Create venv for PyO3
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$GITHUB_WORKSPACE\.venv\Scripts" >> "$GITHUB_PATH"
          else
            echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          fi

      # `--all-targets` is load-bearing, not tidiness. A bare `cargo check` compiles only the
      # normal targets, so `#[cfg(test)]` code is never even TYPE-CHECKED -- and because
      # `gpu_native` is gated behind `#[cfg(feature = "cuda")]` at lib.rs:9-10, `test-rust-core`
      # (default features) never compiles that module at all. The result was a blind spot where
      # the entire gpu_native test module could fail to compile and no CI job would notice.
      # This job is the ONLY oracle for cuda-gated code; `--all-targets` makes it cover the tests
      # it is the only possible oracle for.
      - name: cargo check --features cuda
        working-directory: rust_core
        run: cargo check --features cuda --all-targets

      # Task #279 -- checking is not RUNNING. The step above proves the cuda-gated tests COMPILE;
      # it never executes a single assertion, so `gpu_native.rs`'s test module has always been
      # compile-time protection only.
      #
      # Whether these can run at all on a GPU-less runner was genuinely unknown and NOT answerable
      # locally (CPU-SAFE forbids cargo here, so only CI can say). The evidence said "probably":
      # `cuda = ["dep:cudarc"]`, `cudarc 0.19.3` with feature `cuda-13010`, and there is NO
      # `build.rs`, so no custom link directives -- cudarc dynamically loads the driver rather than
      # linking against it. The gpu_native test module also imports only CPU-side helpers
      # (`line_matches_for_file`, walk-ceiling checks, capacity/PTX-path math), no device init.
      #
      # This step is the experiment. If it links and passes, cuda-gated tests are executed for the
      # first time and the 4 lossless-emitter regression tests from #273/#754 become real gates
      # instead of type-checks. If it fails to LINK on a runner with no CUDA toolkit, that is the
      # answer too -- revert this step and replace it with a comment recording the run id, so the
      # limitation is documented where the next person will look instead of rediscovered.
      # SCOPED TO `--lib` DELIBERATELY. The experiment (first run on this branch) proved the
      # important part: cuda-gated tests LINK and RUN on a GPU-less runner -- cudarc dlopens the
      # driver, it does not link against it. The lib unit-test target passed 156 tests, including
      # `gpu_native.rs`'s `#[cfg(test)]` module and the lossless-emitter regression tests from
      # #273/#754, which had only ever been type-checked before.
      #
      # The `tests/test_gpu_native*.rs` INTEGRATION targets are a different story: they exist to
      # exercise the real GPU engine end-to-end, so they call `enumerate_cuda_devices` /
      # `gpu_native_search` and panic on a runner with no driver:
      #   Unable to dynamically load the "cuda" shared library
      # Five of the six files are device-dependent (34 tests total). Running them here would mean
      # tagging and re-tagging every device-touching test forever, and getting that census wrong
      # is exactly how the first attempt failed -- `cargo test` BAILS at the first failing target,
      # so one run's log shows one file and hides the rest. `--lib` is the invariant, not a census.
      #
      # Full suite on a machine with a GPU:
      #     cargo test --features cuda                  # everything, incl. integration targets
      #     cargo test --features cuda -- --ignored     # the explicitly device-gated ones
      - name: cargo test --features cuda --lib
        working-directory: rust_core
        run: cargo test --features cuda --lib

  search-golden-parity:
    name: search-golden-parity (windows-latest)
    needs: [smoke, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python for PyO3 Linker
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Create venv for PyO3
        shell: bash
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE\.venv\Scripts" >> $GITHUB_PATH

      - name: Run search golden parity test
        working-directory: rust_core
        run: cargo test --test test_search_golden

  native-build-smoke:
    name: native-build-smoke (${{ matrix.os }})
    needs: [smoke, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python for PyO3 Linker
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Create venv for PyO3
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$GITHUB_WORKSPACE\\.venv\\Scripts" >> "$GITHUB_PATH"
          else
            echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Build native release binary
        working-directory: rust_core
        run: cargo build --release --no-default-features

      - name: Smoke-test native release binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          BIN="rust_core/target/release/tg"
          "$BIN" --version
          "$BIN" --help
          workdir="$(mktemp -d)"
          printf 'ERROR one\nINFO two\n' > "$workdir/sample.log"
          "$BIN" search ERROR "$workdir/sample.log"

      - name: Smoke-test native release binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "rust_core\\target\\release\\tg.exe"
          & $bin --version
          & $bin --help
          $workdir = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "tg-native-smoke") -Force
          Set-Content -Path (Join-Path $workdir.FullName "sample.log") -Value "ERROR one`nINFO two"
          & $bin search ERROR (Join-Path $workdir.FullName "sample.log")

      # ripgrep must exist for the byte-parity oracle below. The in-tree fallback
      # (`benchmarks/rg.zip`) is Windows-only -- there is no darwin or linux binary committed --
      # so without this step both macOS legs would resolve no `rg` and SILENTLY skip, which is
      # exactly how a gate stops gating.
      # BOUNDED deliberately. Observed twice on 2026-08-19, both on ubuntu: this step sat
      # in_progress for 2h21m and then 29m while the macOS and windows legs of the SAME run
      # finished in 10-12 minutes. An unbounded apt stall runs to the 6h job limit, so the
      # PR is blocked for hours by a step that emits nothing -- indistinguishable, from the
      # outside, from a slow build. `timeout-minutes` turns that into a fast, legible red;
      # the retry absorbs the transient mirror failure that is the usual cause.
      - name: Ensure ripgrep is available
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          if command -v rg >/dev/null 2>&1; then
            rg --version | head -1
            exit 0
          fi
          case "$RUNNER_OS" in
            macOS) brew install ripgrep ;;
            Linux)
              for attempt in 1 2 3; do
                if sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep; then
                  break
                fi
                echo "apt attempt $attempt failed; retrying in 10s" >&2
                sleep 10
              done
              ;;
            Windows) echo "Windows resolves the committed benchmarks/rg.zip fallback" ;;
          esac
          # A retry loop that exhausts its attempts must not look like success: `for` exits 0
          # on the last iteration regardless, so assert the POSTCONDITION rather than trusting
          # the loop's status.
          if [ "$RUNNER_OS" != "Windows" ] && ! command -v rg >/dev/null 2>&1; then
            echo "ripgrep still unavailable after 3 attempts -- failing rather than letting" >&2
            echo "the rg-parity suites resolve no rg and SILENTLY skip." >&2
            exit 1
          fi

      # Every e2e suite that needs the real compiled native binary MUST run against it here:
      # `test-python` never builds `rust_core/target/release/tg` (maturin builds only the
      # `pyo3/extension-module` cdylib), so any such suite would skip itself there and be a
      # no-op gate. This job is the one place the release binary exists on all four OSes.
      # `tests/helpers/rg_parity` only needs `src/` on PYTHONPATH -- no package build required.
      # TG_REQUIRE_RG_PARITY=1 turns a missing binary from a skip into a FAILURE, so this can
      # never masquerade as coverage.
      #
      # A GLOB (`tests/e2e/test_native_*.py`), not a hardcoded filename: task #266's independent
      # gate found this step naming exactly one file (`test_native_plain_text_parity.py`), so a
      # second native-binary-dependent suite added later (`test_native_json_byte_fidelity.py`)
      # silently skipped everywhere -- correct when written, incomplete the moment a sibling file
      # was added. Do NOT re-enumerate a count here: it already drifted once, silently, from
      # "exactly these two" to (as of the 2026-08-01 backlog campaign) at least four --
      # `test_native_renderer_file_set_invariant.py` and `test_native_ltl_passthrough.py` both
      # joined uncited. `tests/unit/test_native_e2e_ci_coverage_contract.py` is the live
      # governance gate: it derives the census itself via `grep -rl TG_REQUIRE_RG_PARITY tests/`
      # and fails CI the moment this glob misses one. Trust that test, not a number in this
      # comment.
      - name: Run native binary-dependent e2e suites
        shell: bash
        env:
          PYTHONPATH: src
          TG_REQUIRE_RG_PARITY: "1"
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.4.2
          # The native binary DELEGATES some flags (e.g. --ltl) to the Python sidecar via
          # SEARCH_PYTHON_PASSTHROUGH_FLAGS, and `cli/main.py` imports typer/click. Until
          # test_native_ltl_passthrough.py this glob only exercised the self-contained Rust
          # path, so pytest alone sufficed and the gap was invisible: `test-python` has the
          # deps but never builds the release binary, and this job builds the binary but had
          # no deps -- so NO job could test native->sidecar delegation end to end.
          # DERIVE the runtime deps from pyproject; do not hand-list them here (a hardcoded
          # list rots the moment a dependency is added). A requirements FILE, not an inline
          # $(...), because the dep strings carry environment markers and <>= operators.
          python - <<'PYEOF' > "${RUNNER_TEMP:-/tmp}/tg-runtime-deps.txt"
          import tomllib
          for dep in tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]:
              print(dep)
          PYEOF
          python -m pip install --disable-pip-version-check -r "${RUNNER_TEMP:-/tmp}/tg-runtime-deps.txt"
          python -m pytest tests/e2e/test_native_*.py -v --tb=short -p no:cacheprovider

      # DC-002: the ONLY job that can run this, for exactly the reason the comment above
      # gives -- `test-python` has the deps but never builds the release binary; this job
      # builds the binary and (since that fix) has the deps.
      #
      # The two JSON producers were each validated against the SAME committed
      # docs/examples/*.json fixtures and never against each other, so a shared drift or a
      # stale fixture was invisible to both suites. Doing the diff by hand found DC-003
      # (#1020) in five minutes.
      #
      # TG_PARITY_REQUIRE=1 is the anti-skip guard: this test skips when no native binary
      # is resolvable, which is right on a laptop and WRONG here, where the binary was just
      # built two steps up. With the flag set, a missing binary FAILS instead of skipping --
      # otherwise the test would quietly become a permanent no-op in the one job that can
      # actually run it, and report as a passing suite.
      - name: Producer envelope parity (DC-002)
        shell: bash
        env:
          PYTHONPATH: src
          TG_PARITY_REQUIRE: "1"
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            export TG_PARITY_NATIVE_BINARY="rust_core/target/release/tg.exe"
          else
            export TG_PARITY_NATIVE_BINARY="rust_core/target/release/tg"
          fi
          python -m pytest tests/unit/test_producer_envelope_parity.py -v --tb=short -p no:cacheprovider

  test-gpu-linux:
    name: test-gpu-nvidia (ubuntu-latest, cuDF)
    needs: [smoke, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      
      - name: Install uv
        run: python -m pip install uv==0.11.25

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
        
      - name: Install Rust dependencies (for PyO3 fallback)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail https://sh.rustup.rs | sh -s -- --default-toolchain none -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup default 1.96.0
          rustc --version
          cargo --version
        
      - name: Verify cuDF / RAPIDS Configuration (with retry)
        run: |
          set -euo pipefail
          uv venv --python 3.12
          for attempt in 1 2 3 4 5; do
            if uv pip install cudf-cu12 kvikio-cu12 --extra-index-url https://pypi.nvidia.com && \
              uv pip install -e ".[dev,nlp,ast]"; then
              exit 0
            fi
            echo "GPU dependency install failed (attempt ${attempt}/5); retrying after backoff..."
            sleep $((attempt * 10))
          done
          echo "GPU dependency install failed after 5 attempts."
          exit 1
          
      # Since standard GitHub Action runners don't have physical GPUs,
      # we run pytest but rely on our test suites dynamic `@pytest.mark.skipif`
      # to successfully parse the fallback architecture cleanly without crashing.
      - name: Run Pytest with GPU Hooks
        run: uv run pytest tests -v -m "not slow"

  benchmark-regression:
    name: benchmark-regression (ubuntu-latest)
    needs: [smoke, changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Install uv
        run: python -m pip install uv==0.11.25

      - name: Setup Python
        run: uv python install 3.12

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Install benchmark dependencies
        run: |
          uv venv --python 3.12
          uv pip install -e ".[bench,dev]"

      - name: Build benchmark native binary
        working-directory: rust_core
        run: cargo build --release --no-default-features

      - name: Determine benchmark base revision
        if: github.event_name != 'schedule'
        id: benchmark-base
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout base revision for same-runner benchmark comparison
        if: github.event_name != 'schedule'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ steps.benchmark-base.outputs.base_sha }}
          path: base-revision
          fetch-depth: 0
          # CodeQL actions/cache-poisoning/poisonable-step (#16): this checkout resolves a
          # shell-computed ref (base_sha) rather than github.sha, then `cargo build`s it in this
          # job's default-branch/push context. base_sha only ever resolves to same-repo trusted
          # history (github.event.pull_request.base.sha on pull_request, github.event.before or
          # `git rev-parse HEAD^` on push -- never a fork/attacker-controlled value; no
          # pull_request_target is used anywhere in this workflow), and the job already runs
          # with `permissions: contents: read`. persist-credentials: false is the remaining cheap
          # hardening step: nothing this checkout builds needs write-capable git credentials on
          # disk at all.
          persist-credentials: false

      - name: Install base benchmark dependencies
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          cd base-revision
          uv venv --python 3.12
          uv pip install -e ".[bench,dev]"

      - name: Build base benchmark native binary
        if: github.event_name != 'schedule'
        working-directory: base-revision/rust_core
        run: cargo build --release --no-default-features

      - name: Run core benchmark suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          uv run python benchmarks/run_benchmarks.py \
            --output artifacts/bench_run_benchmarks.head.json \
            | tee artifacts/bench_run_benchmarks.head.txt

      - name: Run base benchmark suite
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p base-revision/artifacts
          (
            cd base-revision
            uv run python benchmarks/run_benchmarks.py \
              --output artifacts/bench_run_benchmarks.base.json
          ) | tee base-revision/artifacts/bench_run_benchmarks.base.txt

      - name: Run hot-query benchmark suite
        shell: bash
        run: |
          set -euo pipefail
          uv run python benchmarks/run_hot_query_benchmarks.py \
            --output artifacts/bench_hot_query_benchmarks.head.json \
            | tee artifacts/bench_hot_query_benchmarks.txt

      - name: Run base hot-query benchmark suite
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p base-revision/artifacts
          (
            cd base-revision
            uv run python benchmarks/run_hot_query_benchmarks.py \
              --output artifacts/bench_hot_query_benchmarks.base.json
          ) | tee base-revision/artifacts/bench_hot_query_benchmarks.base.txt

      - name: Enforce hot-query benchmark regression gate
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          current = json.loads(
              Path("artifacts/bench_hot_query_benchmarks.head.json").read_text(encoding="utf-8")
          )
          baseline = json.loads(
              Path("base-revision/artifacts/bench_hot_query_benchmarks.base.json").read_text(
                  encoding="utf-8"
              )
          )
          if not current.get("no_regressions", False):
              raise SystemExit("current hot-query benchmark reported regressions")
          if not baseline.get("no_regressions", False):
              raise SystemExit("baseline hot-query benchmark reported regressions")
          PY

      - name: Run agent workflow benchmark suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          uv run python benchmarks/run_agent_workflow_benchmarks.py \
            --iterations 1 \
            --files 50 \
            --loc 2500 \
            --output artifacts/bench_agent_workflow.head.json \
            | tee artifacts/bench_agent_workflow.head.txt

      - name: Run base agent workflow benchmark suite
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p base-revision/artifacts
          (
            cd base-revision
            TENSOR_GREP_AGENT_WORKFLOW_BENCH_DIR="$PWD/artifacts/bench_agent_workflow" \
            uv run python ../benchmarks/run_agent_workflow_benchmarks.py \
              --binary rust_core/target/release/tg \
              --iterations 1 \
              --files 50 \
              --loc 2500 \
              --output artifacts/bench_agent_workflow.base.json
          ) | tee base-revision/artifacts/bench_agent_workflow.base.txt

      - name: Run agent success harness suite
        shell: bash
        run: |
          set -euo pipefail
          uv run python benchmarks/run_agent_success_harness.py \
            --iterations 1 \
            --output artifacts/bench_agent_success_harness.head.json \
            | tee artifacts/bench_agent_success_harness.head.txt

      - name: Run base agent success harness suite
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p base-revision/artifacts
          (
            cd base-revision
            uv run python benchmarks/run_agent_success_harness.py \
              --iterations 1 \
              --output artifacts/bench_agent_success_harness.base.json
          ) | tee base-revision/artifacts/bench_agent_success_harness.base.txt

      - name: Enforce agent workflow benchmark regression gate
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path


          def _load(path: str) -> dict:
              return json.loads(Path(path).read_text(encoding="utf-8"))


          def _workflow_passed(payload: dict) -> bool:
              return bool(payload.get("all_passed", payload.get("passed", False)))


          def _success_passed(payload: dict) -> bool:
              summary = payload.get("summary")
              return isinstance(summary, dict) and bool(summary.get("all_passed"))


          current_workflow = _load("artifacts/bench_agent_workflow.head.json")
          baseline_workflow = _load("base-revision/artifacts/bench_agent_workflow.base.json")
          current_success = _load("artifacts/bench_agent_success_harness.head.json")
          baseline_success = _load("base-revision/artifacts/bench_agent_success_harness.base.json")

          if not _workflow_passed(current_workflow):
              raise SystemExit("current agent workflow benchmark reported contract failures")
          if not _workflow_passed(baseline_workflow):
              raise SystemExit("baseline agent workflow benchmark reported contract failures")
          if not _success_passed(current_success):
              raise SystemExit("current agent success harness reported contract failures")
          if not _success_passed(baseline_success):
              raise SystemExit("baseline agent success harness reported contract failures")
          PY

      - name: Enforce benchmark regression gate
        if: github.event_name != 'schedule'
        run: |
          uv run python benchmarks/check_regression.py \
            --baseline base-revision/artifacts/bench_run_benchmarks.base.json \
            --current artifacts/bench_run_benchmarks.head.json \
            --max-regression-pct 20.0 \
            --min-baseline-time-s 0.2

      - name: Report accepted benchmark baseline drift
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          uv run python benchmarks/check_regression.py \
            --baseline auto \
            --current artifacts/bench_run_benchmarks.head.json \
            --max-regression-pct 20.0 \
            --min-baseline-time-s 0.2 \
            | tee artifacts/bench_run_benchmarks.accepted_drift.txt

      - name: Build benchmark markdown summary
        shell: bash
        run: |
          set -euo pipefail
          uv run python benchmarks/summarize_benchmarks.py \
            --baseline auto \
            --current artifacts/bench_run_benchmarks.head.json \
            --max-regression-pct 20.0 \
            --min-baseline-time-s 0.2 \
            --output artifacts/benchmark_summary.md
          {
            echo "## Same-runner benchmark gate"
            echo ""
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "Scheduled runs skip the base-vs-head blocking comparison."
            else
              echo "Blocking comparison uses:"
              echo "- baseline: \`base-revision/artifacts/bench_run_benchmarks.base.json\`"
              echo "- current: \`artifacts/bench_run_benchmarks.head.json\`"
            fi
            echo ""
            echo "## Accepted baseline drift report"
            echo ""
            if [ -f artifacts/bench_run_benchmarks.accepted_drift.txt ]; then
              cat artifacts/bench_run_benchmarks.accepted_drift.txt
            else
              echo "No accepted-baseline drift output was captured."
            fi
            echo ""
            cat artifacts/benchmark_summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-artifacts-ci
          path: |
            artifacts/
            base-revision/artifacts/

  release:
    name: Semantic Release
    needs: [smoke, release-readiness, agent-readiness, windows-agent-readiness, package-manager-readiness, static-analysis, test-python, test-rust-core, cuda-feature-check, search-golden-parity, native-build-smoke, test-gpu-linux, benchmark-regression]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && !contains(github.event.head_commit.message, 'skip release')
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.publish_check.outputs.released }}
      publish_pypi: ${{ steps.publish_check.outputs.publish_pypi }}
      release_version: ${{ steps.publish_check.outputs.release_version }}
      release_tag: ${{ steps.publish_check.outputs.release_tag }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@0dc72ac9058a62054a45f6344c83a423d7f906a8 # v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine PyPI Publish Need
        id: publish_check
        env:
          SEMANTIC_RELEASED: ${{ steps.release.outputs.released }}
          SEMANTIC_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SEMANTIC_RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          python - << 'PY'
          import json
          import os
          import urllib.request
          import tomllib
          from pathlib import Path

          released = os.environ.get("SEMANTIC_RELEASED", "").lower() == "true"
          version = os.environ.get("SEMANTIC_RELEASE_VERSION", "").strip()
          tag = os.environ.get("SEMANTIC_RELEASE_TAG", "").strip()
          publish = "false"
          if released:
              if not version:
                  version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
              if not tag:
                  tag = f"v{version}"
              publish = "true"
              try:
                  with urllib.request.urlopen("https://pypi.org/pypi/tensor-grep/json", timeout=10) as resp:
                      data = json.load(resp)
                      releases = data.get("releases", {})
                      if version in releases:
                          publish = "false"
              except Exception:
                  # On transient network or PyPI API issues, prefer a safe publish attempt
                  # after semantic-release has actually produced a new version.
                  publish = "true"
          else:
              version = ""
              tag = ""

          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as f:
              f.write(f"released={'true' if released else 'false'}\n")
              f.write(f"publish_pypi={publish}\n")
              f.write(f"release_version={version}\n")
              f.write(f"release_tag={tag}\n")
          print(f"released={released}")
          print(f"publish_pypi={publish}")
          print(f"release_version={version}")
          print(f"release_tag={tag}")
          PY

  build-wheels-pypi:
    name: build-pypi-wheels (${{ matrix.os }})
    needs: release
    if: needs.release.outputs.publish_pypi == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: v${{ needs.release.outputs.release_version }}
      - name: Prefetch Rust dependencies for PyPI artifacts
        shell: bash
        env:
          CARGO_HTTP_TIMEOUT: "60"
          CARGO_NET_RETRY: "10"
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if cargo fetch --manifest-path rust_core/Cargo.toml; then
              exit 0
            fi
            delay=$((attempt * 15))
            echo "Cargo dependency prefetch failed on attempt ${attempt}/5; retrying in ${delay}s..."
            sleep "$delay"
          done
          echo "Cargo dependency prefetch failed after 5 attempts."
          cargo fetch --manifest-path rust_core/Cargo.toml
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          args: --release --out dist
        env:
          CARGO_HTTP_TIMEOUT: "60"
          CARGO_NET_RETRY: "10"
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pypi-wheels-${{ matrix.os }}
          path: dist

  build-sdist-pypi:
    name: build-pypi-sdist
    needs: release
    if: needs.release.outputs.publish_pypi == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: v${{ needs.release.outputs.release_version }}
      - name: Prefetch Rust dependencies for PyPI artifacts
        shell: bash
        env:
          CARGO_HTTP_TIMEOUT: "60"
          CARGO_NET_RETRY: "10"
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if cargo fetch --manifest-path rust_core/Cargo.toml; then
              exit 0
            fi
            delay=$((attempt * 15))
            echo "Cargo dependency prefetch failed on attempt ${attempt}/5; retrying in ${delay}s..."
            sleep "$delay"
          done
          echo "Cargo dependency prefetch failed after 5 attempts."
          cargo fetch --manifest-path rust_core/Cargo.toml
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist
        env:
          CARGO_HTTP_TIMEOUT: "60"
          CARGO_NET_RETRY: "10"
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pypi-sdist
          path: dist

  validate-pypi-artifacts:
    name: validate-pypi-artifacts
    needs: [release, build-wheels-pypi, build-sdist-pypi]
    if: needs.release.outputs.publish_pypi == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Download all distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: pypi-*
          path: dist
          merge-multiple: true
      - name: Validate built PyPI artifact set
        run: |
          python scripts/validate_pypi_artifacts.py \
            --dist-dir dist \
            --version "${{ needs.release.outputs.release_version }}" \
            --require-platforms "linux,macos,windows"
      - name: Smoke-test install from built PyPI artifacts
        run: |
          python scripts/smoke_test_pypi_artifacts.py \
            --dist-dir dist \
            --version "${{ needs.release.outputs.release_version }}" \
            --work-dir .tmp

  build-release-native-assets:
    name: build-release-native-assets (${{ matrix.os }}, ${{ matrix.acceleration }})
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      RELEASE_NATIVE_ASSET_PROFILE: ${{ vars.TENSOR_GREP_RELEASE_NATIVE_ASSET_PROFILE || 'native-frontdoor' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            acceleration: cpu
            cargo_args: --no-default-features
            asset_name: tg-linux-amd64-cpu
          - os: ubuntu-latest
            acceleration: nvidia
            cargo_args: --features cuda
            asset_name: tg-linux-amd64-nvidia
          - os: windows-latest
            acceleration: cpu
            cargo_args: --no-default-features
            asset_name: tg-windows-amd64-cpu.exe
          - os: windows-latest
            acceleration: nvidia
            cargo_args: --features cuda
            asset_name: tg-windows-amd64-nvidia.exe
          - os: macos-15-intel
            acceleration: cpu
            cargo_args: --no-default-features
            asset_name: tg-macos-amd64-cpu
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        if: matrix.acceleration == 'cpu' || env.RELEASE_NATIVE_ASSET_PROFILE == 'native-frontdoor-gpu'
        with:
          ref: v${{ needs.release.outputs.release_version }}

      - name: Setup Rust stable
        if: matrix.acceleration == 'cpu' || env.RELEASE_NATIVE_ASSET_PROFILE == 'native-frontdoor-gpu'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python for PyO3 Linker
        if: matrix.acceleration == 'cpu' || env.RELEASE_NATIVE_ASSET_PROFILE == 'native-frontdoor-gpu'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Create venv for PyO3
        if: matrix.acceleration == 'cpu' || env.RELEASE_NATIVE_ASSET_PROFILE == 'native-frontdoor-gpu'
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$GITHUB_WORKSPACE\\.venv\\Scripts" >> "$GITHUB_PATH"
          else
            echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Build native release front door
        if: matrix.acceleration == 'cpu' || env.RELEASE_NATIVE_ASSET_PROFILE == 'native-frontdoor-gpu'
        working-directory: rust_core
        run: cargo build --release ${{ matrix.cargo_args }}

      - name: Package native release front door
        if: matrix.acceleration == 'cpu' || env.RELEASE_NATIVE_ASSET_PROFILE == 'native-frontdoor-gpu'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.release_version }}
          NATIVE_ASSET_NAME: ${{ matrix.asset_name }}
        run: |
          set -euo pipefail
          mkdir -p dist-native
          if [ "$RUNNER_OS" = "Windows" ]; then
            src="rust_core/target/release/tg.exe"
          elif [ "$RUNNER_OS" = "Linux" ]; then
            src="rust_core/target/release/tg"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            src="rust_core/target/release/tg"
          else
            echo "Unsupported runner OS: $RUNNER_OS"
            exit 1
          fi
          dest="dist-native/${NATIVE_ASSET_NAME}"
          cp "$src" "$dest"
          chmod +x "$dest" || true
          "$src" --version | tee version.txt
          grep -Fx "tg ${RELEASE_VERSION}" version.txt
          "$src" --help >/dev/null

      - name: Upload native release front door
        if: matrix.acceleration == 'cpu' || env.RELEASE_NATIVE_ASSET_PROFILE == 'native-frontdoor-gpu'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-native-${{ matrix.os }}-${{ matrix.acceleration }}
          path: dist-native/

  publish-github-release-assets:
    name: publish-github-release-assets
    needs: [release, build-release-native-assets]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: v${{ needs.release.outputs.release_version }}

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: Setup Python
        run: uv python install 3.12

      - name: Download native release front doors
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-native-*
          path: artifacts/native

      - name: Validate native release asset matrix and generate checksums
        env:
          RELEASE_NATIVE_ASSET_PROFILE: ${{ vars.TENSOR_GREP_RELEASE_NATIVE_ASSET_PROFILE || 'native-frontdoor' }}
        run: |
          uv run python scripts/validate_release_binary_artifacts.py \
            --artifacts-dir artifacts/native \
            --checksums-out artifacts/CHECKSUMS.txt \
            --expected-profile "$RELEASE_NATIVE_ASSET_PROFILE"

      - name: Build package-manager publish bundle
        run: |
          uv run python scripts/prepare_package_manager_release.py \
            --output-dir artifacts/package-manager-bundle \
            --release-checksums artifacts/CHECKSUMS.txt

      - name: Verify package-manager bundle checksums
        run: |
          uv run python scripts/verify_package_manager_bundle_checksums.py \
            --bundle-dir artifacts/package-manager-bundle

      - name: Smoke-test package-manager bundle contracts
        run: |
          uv run python scripts/smoke_test_package_manager_bundle.py \
            --bundle-dir artifacts/package-manager-bundle \
            --expected-version "${{ needs.release.outputs.release_version }}"

      - name: Upload GitHub release native assets
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          tag_name: v${{ needs.release.outputs.release_version }}
          fail_on_unmatched_files: true
          files: |
            artifacts/native/**/tg-*
            artifacts/CHECKSUMS.txt
            artifacts/package-manager-bundle/homebrew-tap/Formula/tensor-grep.rb
            artifacts/package-manager-bundle/winget-pkgs/manifests/o/oimiragieo/tensor-grep/${{ needs.release.outputs.release_version }}/oimiragieo.tensor-grep.yaml
            artifacts/package-manager-bundle/PUBLISH_INSTRUCTIONS.md
            artifacts/package-manager-bundle/BUNDLE_CHECKSUMS.txt

      - name: Verify GitHub release native asset coverage
        env:
          RELEASE_NATIVE_ASSET_PROFILE: ${{ vars.TENSOR_GREP_RELEASE_NATIVE_ASSET_PROFILE || 'native-frontdoor' }}
        run: |
          uv run python scripts/verify_github_release_assets.py \
            --repo "${{ github.repository }}" \
            --tag "v${{ needs.release.outputs.release_version }}" \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            --expected-profile "$RELEASE_NATIVE_ASSET_PROFILE" \
            --wait-seconds 120 \
            --poll-interval-seconds 5

  publish-pypi:
    name: publish-pypi
    needs: [release, build-wheels-pypi, build-sdist-pypi, validate-pypi-artifacts, publish-github-release-assets]
    if: needs.release.outputs.publish_pypi == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tensor-grep
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: v${{ needs.release.outputs.release_version }}

      - name: Download all distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: pypi-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          skip-existing: true

      - name: Verify release version parity across tag/assets/PyPI
        run: |
          python scripts/validate_release_version_parity.py \
            --expected-version "${{ needs.release.outputs.release_version }}" \
            --expected-tag "v${{ needs.release.outputs.release_version }}" \
            --dist-dir dist \
            --check-pypi \
            --pypi-wait-seconds 180 \
            --pypi-poll-interval-seconds 10

  publish-success-gate:
    name: publish-success-gate
    needs: [release, publish-pypi, publish-github-release-assets]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Skip publish parity gate when semantic-release produced no version
        if: needs.release.outputs.released != 'true'
        run: |
          echo "No semantic-release release for this commit; skipping publish parity gate."

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        if: needs.release.outputs.released == 'true'
        with:
          ref: v${{ needs.release.outputs.release_version }}

      - name: Download all distributions
        if: needs.release.outputs.released == 'true' && needs.release.outputs.publish_pypi == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: pypi-*
          path: dist
          merge-multiple: true

      - name: Confirm publish job result when publishing is required
        if: needs.release.outputs.released == 'true'
        run: |
          if [ "${{ needs.release.result }}" != "success" ]; then
            echo "release job did not succeed."
            exit 1
          fi
          if [ "${{ needs.release.outputs.publish_pypi }}" != "true" ]; then
            echo "publish_pypi=false, skipping publish-pypi job result check."
            exit 0
          fi
          if [ "${{ needs.publish-pypi.result }}" != "success" ]; then
            echo "publish-pypi job did not succeed."
            exit 1
          fi
          echo "publish-pypi job succeeded."

      - name: Confirm GitHub release asset job result when publishing is required
        if: needs.release.outputs.released == 'true'
        run: |
          if [ "${{ needs.publish-github-release-assets.result }}" != "success" ]; then
            echo "publish-github-release-assets job did not succeed."
            exit 1
          fi
          echo "publish-github-release-assets job succeeded."

      - name: Verify GitHub release native assets for semantic-release version
        if: needs.release.outputs.released == 'true'
        env:
          RELEASE_NATIVE_ASSET_PROFILE: ${{ vars.TENSOR_GREP_RELEASE_NATIVE_ASSET_PROFILE || 'native-frontdoor' }}
        run: |
          python scripts/verify_github_release_assets.py \
            --repo "${{ github.repository }}" \
            --tag "v${{ needs.release.outputs.release_version }}" \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            --expected-profile "$RELEASE_NATIVE_ASSET_PROFILE" \
            --wait-seconds 120 \
            --poll-interval-seconds 5

      - name: Verify PyPI parity for semantic-release version (always)
        if: needs.release.outputs.released == 'true'
        run: |
          PARITY_ARGS=(
            --expected-version "${{ needs.release.outputs.release_version }}"
            --expected-tag "v${{ needs.release.outputs.release_version }}"
            --check-pypi
            --pypi-wait-seconds 180
            --pypi-poll-interval-seconds 10
          )
          if [ "${{ needs.release.outputs.publish_pypi }}" = "true" ]; then
            PARITY_ARGS+=(--dist-dir dist)
          fi
          python scripts/validate_release_version_parity.py "${PARITY_ARGS[@]}"

  release-tag-smoke:
    name: release-tag-smoke
    needs: [release, publish-success-gate]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: v${{ needs.release.outputs.release_version }}

      - name: Install uv
        run: python -m pip install uv==0.11.25

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Python Dev Dependencies
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Validate stamped release assets on release tag
        run: uv run python scripts/validate_release_assets.py

      - name: Run release-tag contract smoke
        run: |
          uv run python scripts/agent_readiness.py \
            --no-shell-probes \
            --no-wsl-probe \
            --json \
            --output artifacts/agent_readiness_release_tag.json
