[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = true

[advisories]
# Keep this gate strict for security vulnerabilities.
# Transitive `unmaintained` notices from arrow / pyo3-arrow 0.19.0:
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono is a transitive dependency of arrow / pyo3-arrow 0.19.0 (unmaintained notice, not a vulnerability)" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz is a transitive dependency of arrow / pyo3-arrow 0.19.0 (unmaintained notice, not a vulnerability)" },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
]

[[licenses.exceptions]]
crate = "foldhash@0.2.0"
allow = ["Zlib"]
