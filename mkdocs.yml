site_name: tensor-grep
site_description: Search code and logs, understand symbols, and prepare changes
site_author: tensor-grep team
repo_url: https://github.com/oimiragieo/tensor-grep
repo_name: oimiragieo/tensor-grep

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - First Search: getting-started.md
    - Support Matrix: SUPPORT_MATRIX.md
  - Daily Workflows:
    - Automation Recipes: harness_cookbook.md
    - Cache Management: runbooks/cache-management.md
    - Experimental Features: EXPERIMENTAL.md
  - How It Works:
    - Architecture: architecture.md
    - Execution Routing: routing_policy.md
    - Benchmarks: benchmarks.md
    - Tool Comparison: tool_comparison.md
  - Technical Reference:
    - Contracts: CONTRACTS.md
    - CLI and MCP API: harness_api.md
    - Session Daemon Protocol: session_daemon_protocol.md
    - Multi-Agent Context Plane: multi_agent_context_plane.md
    - Review Bundle CI Gate: enterprise_review_bundle_ci.md
  - Maintainers:
    - CI Pipeline: CI_PIPELINE.md
    - Release Checklist: RELEASE_CHECKLIST.md
    - Hotfix Procedure: HOTFIX_PROCEDURE.md
    - Package Manager Publish: package_manager_publish.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
