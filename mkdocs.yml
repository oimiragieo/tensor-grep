site_name: tensor-grep
site_description: Native search and rewrite tool for large text corpora and codebases
site_author: tensor-grep team
repo_url: https://github.com/oimiragieo/tensor-grep
repo_name: oimiragieo/tensor-grep

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy

# Internal analysis lives under docs/ for discoverability, but mkdocs builds EVERYTHING
# under docs_dir into the published site -- nav'd or not. `docs/positioning/` holds
# competitive analysis that discusses the CEO-GATED #72 benchmark, and `publish-docs`
# runs `mkdocs gh-deploy --force` unconditionally on release into a PUBLIC repo.
# Verified not yet exposed (gh-pages last built 2026-03-01, months before those files
# existed; `positioning/` returns 404 there while the branch root reads 14 entries, so
# the 404 is meaningful and not an API artifact). Excluding it keeps that true.
exclude_docs: |
  positioning/
  audits/
  investigations/
  superpowers/

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - CI Pipeline: CI_PIPELINE.md
    - Support Matrix: SUPPORT_MATRIX.md
    - Contracts: CONTRACTS.md
    - Review Bundle CI Gate: enterprise_review_bundle_ci.md
    - Experimental Features: EXPERIMENTAL.md
    - Release Checklist: RELEASE_CHECKLIST.md
    - Hotfix Procedure: HOTFIX_PROCEDURE.md
    - Package Manager Publish: package_manager_publish.md
  - Architecture: architecture.md
  - Session Daemon Protocol: session_daemon_protocol.md
  - Multi-Agent Context Plane: multi_agent_context_plane.md
  - Benchmarks: benchmarks.md
  - Tool Comparison: tool_comparison.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
